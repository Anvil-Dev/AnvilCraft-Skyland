tasks.register('sourcesJar', Jar) {
    from delombok.outputs.files
    dependsOn delombok
    archiveClassifier = "sources"
}

jar {
    // 提前捕获到局部变量，避免 rename 闭包在执行期解析不到 project 扩展属性
    String fileSuffix = "_${mod_id}"
    from(project.file("LICENSE")) {
        rename { "${it}${fileSuffix}" }
    }
    from(project.file("ASSETS_LICENSE")) {
        rename { "${it}${fileSuffix}" }
    }
    from(project.file("README.md")) {
        rename { "${it}${fileSuffix}" }
    }
    from(project.file("README_en.md")) {
        rename { "${it}${fileSuffix}" }
    }
}

base {
    archivesName = mod_name + "-neoforge-1.21.1"
}
