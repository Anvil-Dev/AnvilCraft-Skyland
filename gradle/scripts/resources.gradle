var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : libs.versions.minecraft.get(),
            minecraft_version_range: minecraft_version_range,
            neo_version            : libs.versions.neoForge.get(),
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// 打包时将 src/generated/resources/data/skyland 下路径含有 anvilcraft_skyland/ 的 datagen 产物
// 从 jar 根目录排除，改以 resourcepacks/skyland_anvilcraft/data/skyland/ 路径打进 jar（内置数据包）
tasks.named('processResources', ProcessResources) {
    exclude 'data/skyland/**/anvilcraft_skyland/**'
    from('src/generated/resources/data/skyland') {
        include '**/anvilcraft_skyland/**'
        into 'resourcepacks/skyland_anvilcraft/data/skyland'
    }
}
