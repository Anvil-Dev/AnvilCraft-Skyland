name: Pull Request Check
on:
  workflow_dispatch:
  pull_request:
    branches:
      - releases/**
    paths:
      - src/**
      - common/**
      - fabric/**
      - forge/**
      - build.gradle
      - gradle.properties
      - settings.gradle

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_BUILD: true
      PR_BUILD: true
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name java_version'

      - name: Setup Java ${{ steps.properties.outputs.java_version }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: ${{ steps.properties.outputs.java_version }}

      - name: Read Versions
        id: versions
        uses: Gu-ZT/toml-reader-action@1.0.0
        with:
          file: gradle/libs.versions.toml
          fields: |
            versions.minecraft
            versions.neoForge
            versions.anvilcraft
            versions.rollingGate

      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew build

      - name: Get Version
        id: version
        run: |
          MESSAGE=$(ls build/libs/* | grep sources.jar -v | grep shadow.jar -v | grep slim.jar -v | awk -F '${{ steps.properties.outputs.mod_id }}-neoforge-1.21.1-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: capture build artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ steps.properties.outputs.mod_id }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar

      - name: gametest
        uses: Anvil-Dev/dedicated-server-launch-test@universal
        continue-on-error: false
        with:
          mod_loader: neoforge
          loader_version: ${{ steps.versions.outputs.versions_neoForge }}
          mods: build/libs/${{ steps.properties.outputs.mod_id }}-neoforge-1.21.1-${{ steps.version.outputs.version }}.jar
          maven-repos: |
            https://server.cjsah.net:1002/maven/releases/
          maven-mods: |
            dev.dubhe:anvilcraft-neoforge-1.21.1:${{ steps.versions.outputs.versions_anvilcraft }}
            dev.anvilcraft.rg:RollingGate:${{ steps.versions.outputs.versions_rollingGate }}
